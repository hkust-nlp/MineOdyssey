# Minecraft 服务端配置
# 由容器首次启动时自动生成，可手动修改

# 服务器端口
server-port=25565

# 游戏模式（survival, creative, adventure）
gamemode=survival
force-gamemode=false

# 难度（peaceful, easy, normal, hard）
difficulty=normal

# 在线模式（false = 离线模式，无需正版验证）
online-mode=false

# 最大玩家数
max-players=20

# 服务器名称
motd=AI Agent Minecraft Server

# 视距（建议 8-16）
view-distance=10

# 允许飞行
allow-flight=true

# PVP
pvp=true

# 出生点保护（0 = 关闭）
spawn-protection=0

# 白名单
white-list=false
enforce-whitelist=false

# 生成结构
generate-structures=true

# 世界类型
level-type=minecraft\:normal

# 种子（留空随机）
level-seed=

# 启用命令方块
enable-command-block=true
